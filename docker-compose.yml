services:
  subsync:
    build: .
    container_name: subsync-daemon
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - type: bind
        source: /mnt/gdrive
        target: /mnt/gdrive
        bind:
          propagation: rslave